<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ondřej Roszkowski</title>

    <style>
        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, #430a0e, #59182b);
            font-family: Arial, sans-serif;
            color: #430a0e;
        }

        .vizitka {
            width: min(90%, 620px);
            padding: 32px;
            display: flex;
            align-items: center;
            gap: 28px;
            background: #ffffff;
            border-radius: 22px;
            box-shadow: 0 16px 40px #00000055;
        }

        .fotka {
            width: 180px;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 18px;
            border: 4px solid #430a0e;
        }

        .obsah h1 {
            margin: 0 0 8px;
            color: #430a0e;
            font-size: 30px;
        }

        .obsah p {
            line-height: 1.6;
            color: #111111;
        }

        .stitky {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 0;
            list-style: none;
        }

        
        .stitky li {
            padding: 8px 12px;
            border: 1px solid #430a0e;
            border-radius: 999px;
            background: #f2f2f2;
            color: #111111;
        }

    </style>
</head>

<body>
    <div class="vizitka">
        <img src="profil.JPEG" class="fotka" alt="Fotka Ondřeje Roszkowského"
            onclick="alert('Ahoj, vítej na mé vizitce!')">

        <div class="obsah">
            <h1>Ondřej Roszkowski</h1>
            <p>Jsem Ondrej. <br>Vitejte na me vizitce</p>

            <h2>Co mě baví</h2>
            <ul class="stitky">
                <li>programování</li>
                <li>florbal</li>
                <li>kamarádi</li>
            </ul>
        </div>
    </div>
</body>

</html>
